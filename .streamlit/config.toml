[server]
maxUploadSize = 35  # MB; must match MAX_UPLOAD_BYTES in src/datanaut/limits.py
maxMessageSize = 100
headless = true
enableXsrfProtection = true
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[logger]
level = "info"

[theme]
base = "dark"
primaryColor = "#7c9cff"
backgroundColor = "#0a0c10"
secondaryBackgroundColor = "#11141b"
textColor = "#e6e9ef"
font = "sans serif"
borderColor = "#232938"

[theme.sidebar]
backgroundColor = "#0d1016"
